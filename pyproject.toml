[project]
name = "sound-loops"
version = "0.1.0"
description = "Подбор звука для немых видео-лупов: транспорт и случайный baseline (итерация 0)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "numpy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "torch>=2.4",
    "transformers>=4.45",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
sound-loops = "sound_loops.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sound_loops"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
